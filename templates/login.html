<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Mi Tienda en Línea</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	<link rel="stylesheet" type="text/css" href="{{url_for('static', filename='css/style.css')}}">
</head>
<body>
	<header>
		<nav>
			<ul>
				<li><a href="{{url_for('inicio')}}"><i class="fa-solid fa-house"></i>Home</a></li>
				<li><a href="{{url_for('Catalogo')}}"><i class="fa-solid fa-store"></i>Catalogo</a></li>
				<li class="right"><a href="{{url_for('login')}}"><i class="fa-solid fa-right-to-bracket"></i>Iniciar sesión</a></li>
				<li><a href="{{url_for('agregarCliente')}}"><i class="fa-solid fa-user-plus"></i>Registrarse</a></li>
				<li><a href="{{url_for('AdminLogin')}}"><i class="fa-solid fa-user-shield"></i>Admin</a></li>
			</ul>
		</nav>
	</header>

	<main>
		<div class="login">
			<div class="login-titulo">
				<span class="login-icono"><i class="fa-solid fa-circle-user"></i></span>
				<h1>Iniciar sesión</h1>
			</div>
			<form method="post">
				<div class="form-group campo">
					<i class="fa-solid fa-envelope"></i>
					<input type="email" name="email" placeholder="Correo electrónico" required>
				</div>
				<div class="form-group campo">
					<i class="fa-solid fa-lock"></i>
					<input class="con-ver" type="password" name="password" placeholder="Contraseña" required>
					<button type="button" class="ver-clave" onclick="var c=this.closest('.campo');var i=c.querySelector('input');var v=i.type==='text';i.type=v?'password':'text';this.querySelector('i').className=v?'fa-solid fa-eye':'fa-solid fa-eye-slash';" aria-label="Mostrar u ocultar contraseña"><i class="fa-solid fa-eye"></i></button>
				</div>
				<button type="submit"><i class="fa-solid fa-right-to-bracket"></i>Iniciar sesión</button>
				<p class="enlace-aux">
					<a href="{{ url_for('recuperar_contrasena') }}">
						¿Olvidaste tu contraseña?
					</a>
				</p>
				{% if error %}
					<p class="mensaje-error">{{ error }}</p>
				{% endif %}
			</form>
			<p>¿No tienes una cuenta? <a href="{{url_for('agregarCliente')}}">Regístrate aquí</a></p>
		</div>
	</main>

	<footer>
		<p>Derechos Reservados &copy; ShopEase 2023</p>
	</footer>

	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script src="{{url_for('static', filename='js/ui.js')}}"></script>
</body>
</html>
