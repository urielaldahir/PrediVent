<!DOCTYPE html>
<html>
<head>
    <title>Recuperar contraseña - PrediVent</title>

    <link rel="stylesheet"
          type="text/css"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header>
    <nav>
        <ul>
            <li><a href="{{ url_for('inicio') }}">Home</a></li>
            <li><a href="{{ url_for('Catalogo') }}">Catalogo</a></li>
            <li><a href="{{ url_for('login') }}">Iniciar sesión</a></li>
            <li><a href="{{ url_for('agregarCliente') }}">Registrarse</a></li>
            <li><a href="{{ url_for('AdminLogin') }}">Admin</a></li>
        </ul>
    </nav>
</header>

<main>

    <div class="login">

        <h1>Recuperar contraseña</h1>

        <p>
            Introduce el correo electrónico asociado a tu cuenta.
        </p>

        <form method="post">

            <div class="form-group">
                <input
                    type="email"
                    name="email"
                    placeholder="Correo electrónico"
                    required>
            </div>

            <button type="submit">
                Enviar enlace
            </button>

        </form>

        {% if error %}
            <p>{{ error }}</p>
        {% endif %}

        {% if mensaje %}
            <p>{{ mensaje }}</p>
        {% endif %}

        <p>
            <a href="{{ url_for('login') }}">
                Volver a iniciar sesión
            </a>
        </p>

    </div>

</main>

<footer>
    <p>Derechos Reservados &copy; PrediVent</p>
</footer>

</body>
</html>
