<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contraseña - PrediVent</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet"
          type="text/css"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<header>
    <nav>
        <ul>
            <li><a href="{{ url_for('inicio') }}"><i class="fa-solid fa-house"></i>Home</a></li>
            <li><a href="{{ url_for('Catalogo') }}"><i class="fa-solid fa-store"></i>Catalogo</a></li>
            <li class="right"><a href="{{ url_for('login') }}"><i class="fa-solid fa-right-to-bracket"></i>Iniciar sesión</a></li>
            <li><a href="{{ url_for('agregarCliente') }}"><i class="fa-solid fa-user-plus"></i>Registrarse</a></li>
            <li><a href="{{ url_for('AdminLogin') }}"><i class="fa-solid fa-user-shield"></i>Admin</a></li>
        </ul>
    </nav>
</header>

<main>

    <div class="login">

        <div class="login-titulo">
            <span class="login-icono"><i class="fa-solid fa-key"></i></span>
            <h1>Recuperar contraseña</h1>
        </div>

        <p>
            Introduce el correo electrónico asociado a tu cuenta.
        </p>

        <form method="post">

            <div class="form-group campo">
                <i class="fa-solid fa-envelope"></i>
                <input
                    type="email"
                    name="email"
                    placeholder="Correo electrónico"
                    required>
            </div>

            <button type="submit">
                <i class="fa-solid fa-paper-plane"></i>Enviar enlace
            </button>

        </form>

        {% if error %}
            <p class="mensaje-error" data-titulo="No se pudo enviar el enlace">{{ error }}</p>
        {% endif %}

        {% if mensaje %}
            <p class="mensaje-ok" data-titulo="Revisa tu correo">{{ mensaje }}</p>
        {% endif %}

        <p>
            <a href="{{ url_for('login') }}">
                <i class="fa-solid fa-arrow-left"></i>Volver a iniciar sesión
            </a>
        </p>

    </div>

</main>

<footer>
    <p>Derechos Reservados &copy; PrediVent</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="{{ url_for('static', filename='js/ui.js') }}"></script>

</body>
</html>
