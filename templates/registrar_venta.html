<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Registrar Venta - PrediVent</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<header>

    <nav>

        <ul>

            <li>
                <a href="{{ url_for('HomeEmpleado') }}">
                    <i class="fa-solid fa-house"></i>Home
                </a>
            </li>

            <li>
                <a href="{{ url_for('Catalogo') }}">
                    <i class="fa-solid fa-store"></i>Catálogo
                </a>
            </li>

            <li>
                <a href="{{ url_for('registrarVentaEmpleado') }}">
                    <i class="fa-solid fa-cash-register"></i>Registrar venta
                </a>
            </li>

            <li class="right">
                <a href="{{ url_for('logout2') }}" data-confirm="¿Deseas cerrar sesión?">
                    <i class="fa-solid fa-right-from-bracket"></i>Cerrar Sesión
                </a>
            </li>

        </ul>

    </nav>

</header>


<main>

    <div class="login">

        <div class="login-titulo">
            <span class="login-icono"><i class="fa-solid fa-cash-register"></i></span>
            <h1>Registrar venta</h1>
        </div>

        <p class="chip-empleado">
            <i class="fa-solid fa-id-badge"></i>
            Empleado:
            <strong>{{ session.get('nombre_empleado') }}</strong>
        </p>


        {% if error %}

            <p class="mensaje-error" data-titulo="No se pudo registrar la venta">
                {{ error }}
            </p>

        {% endif %}


        {% if mensaje %}

            <p class="mensaje-ok" data-titulo="Venta registrada">
                {{ mensaje }}
            </p>

        {% endif %}


        <form method="POST">

            <!-- ==================================================
                 CLIENTE
            =================================================== -->

            <div class="grupo">

                <label for="id_cliente">
                    Cliente:
                </label>

                <div class="campo">

                    <i class="fa-solid fa-user"></i>

                    <select
                        name="id_cliente"
                        id="id_cliente"
                        required
                    >

                        <option value="">
                            Selecciona un cliente
                        </option>

                        {% for cliente in clientes %}

                            <option value="{{ cliente.id_cliente }}">

                                {{ cliente.nombre }}

                                -
                                {{ cliente.correo }}

                            </option>

                        {% endfor %}

                    </select>

                </div>

            </div>


            <!-- ==================================================
                 PRODUCTO
            =================================================== -->

            <div class="grupo">

                <label for="id_producto">
                    Producto:
                </label>

                <div class="campo">

                    <i class="fa-solid fa-box-open"></i>

                    <select
                        name="id_producto"
                        id="id_producto"
                        required
                    >

                        <option value="">
                            Selecciona un producto
                        </option>

                        {% for producto in productos %}

                            <option value="{{ producto.id_producto }}">

                                {{ producto.nombre_producto }}

                                - ${{ producto.precio }}

                            </option>

                        {% endfor %}

                    </select>

                </div>

            </div>


            <!-- ==================================================
                 CANTIDAD
            =================================================== -->

            <div class="grupo">

                <label for="cantidad">
                    Cantidad:
                </label>

                <div class="campo">

                    <i class="fa-solid fa-boxes-stacked"></i>

                    <input
                        type="number"
                        name="cantidad"
                        id="cantidad"
                        min="1"
                        required
                    >

                </div>

            </div>


            <!-- ==================================================
                 BOTÓN
            =================================================== -->

            <div class="acciones-form">

                <button type="submit">
                    <i class="fa-solid fa-check"></i>Registrar venta
                </button>

            </div>

        </form>

    </div>

</main>


<footer>

    <p>
        Derechos Reservados &copy; PrediVent
    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="{{ url_for('static', filename='js/ui.js') }}"></script>

</body>

</html>
