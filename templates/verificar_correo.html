<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Verificar correo - PrediVent</title>
    <link rel="stylesheet" type="text/css" href="{{url_for('static', filename='css/style.css')}}">
</head>
<body>
<header>
    <nav>
        <ul>
            <li><a href="{{url_for('inicio')}}">Home</a></li>
            <li><a href="{{url_for('login')}}">Iniciar sesión</a></li>
        </ul>
    </nav>
</header>

<main>
    <div class="login">
        <h1>Verifica tu correo</h1>
        <p>Enviamos un código de 6 dígitos a:</p>
        <p><strong>{{ correo }}</strong></p>

        <form method="POST">
            <input type="text"
                   name="codigo"
                   maxlength="6"
                   minlength="6"
                   inputmode="numeric"
                   pattern="[0-9]{6}"
                   placeholder="Código de 6 dígitos"
                   required>

            <button type="submit">Verificar correo</button>
        </form>

        {% if error %}
            <p>{{ error }}</p>
        {% endif %}

        <p>El código tiene una vigencia de 10 minutos.</p>
    </div>
</main>

<footer>
    <p>PrediVent</p>
</footer>
</body>
</html>
